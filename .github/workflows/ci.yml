name: CI

on:
  push:
    branches: [main, pegline]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    # Pegline targets macOS 27 and needs the macOS 27 SDK (Xcode 27).
    # Change the runner label if GitHub names its macOS 27 image differently.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          sw_vers
          xcrun --show-sdk-version
          swift --version
      - name: Unit tests
        run: swift test
      - name: Build app bundle
        run: scripts/build-app.sh release
      - name: Release build has no debug hooks or build paths
        run: |
          BIN=build/Pegline.app/Contents/MacOS/Pegline
          if strings -a "$BIN" | grep -E "PEGLINE_SELFTEST|render-preview|/Users/|/home/"; then
            echo "Debug-only code or local paths found in the release binary" >&2
            exit 1
          fi
          if nm -ap "$BIN" | grep -E " (OSO|SO) "; then
            echo "Debug symbols with source paths found in the release binary" >&2
            exit 1
          fi
